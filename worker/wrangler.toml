name = "chumbada-minha-selecao"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "CART"
class_name = "CartSession"

# Per-IP request cap (checked in src/index.js, answers 429). Counters are kept per
# Cloudflare location, so this blunts floods from a single source rather than
# being an exact global quota.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 200, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CartSession"]

# Hub de Análise: o Worker grava os eventos da lista no mesmo banco D1 do painel.
[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "chumbada-analytics"
database_id = "c1582832-1031-4ccd-84eb-bfd618893720"
