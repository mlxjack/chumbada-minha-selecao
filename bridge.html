<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Minha Seleção — serviço interno</title>
</head>
<body>
<p style="font-family:sans-serif;color:#999;text-align:center;margin-top:40vh">Serviço interno Chumbada Oficial.</p>
<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'chumbada:minha-selecao:v1';

  var ALLOWED_ORIGINS = [
    'https://precodasiscas.chumbada.com.br',
    'https://precosdosanzois.chumbada.com.br',
    'https://precodaschumbadas.chumbada.com.br',
    'https://precodosacessorios.chumbada.com.br',
    'https://precodosoculos.chumbada.com.br',
    'https://catalogosdeprecos.chumbada.com.br'
  ];

  function isAllowedOrigin(origin) {
    if (ALLOWED_ORIGINS.indexOf(origin) !== -1) return true;
    // Local dev servers only — event.origin cannot be spoofed by page content,
    // so allowing localhost here poses no risk to the production deployment.
    return /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(origin);
  }

  function normalizeVariant(v) {
    return (v || '')
      .toString()
      .normalize('NFD')
      .replace(/[̀-ͯ]/g, '')
      .toLowerCase()
      .trim()
      .replace(/\s+/g, ' ');
  }

  function computeItemId(item) {
    var key = item.sku || item.productId || '';
    return item.catalog + '::' + key + '::' + normalizeVariant(item.variant);
  }

  function readState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { storeName: '', items: [] };
      var parsed = JSON.parse(raw);
      return {
        storeName: typeof parsed.storeName === 'string' ? parsed.storeName : '',
        items: Array.isArray(parsed.items) ? parsed.items : []
      };
    } catch (e) {
      return { storeName: '', items: [] };
    }
  }

  function writeState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function handle(type, payload, state) {
    switch (type) {
      case 'GET_STATE':
        return state;

      case 'SET_STORE_NAME':
        state.storeName = ((payload && payload.storeName) || '').slice(0, 120);
        return state;

      case 'ADD_ITEM': {
        var item = payload || {};
        var id = computeItemId(item);
        var qty = Math.max(1, Math.floor(Number(item.qty) || 1));
        var existing = null;
        for (var i = 0; i < state.items.length; i++) {
          if (state.items[i].id === id) { existing = state.items[i]; break; }
        }
        if (existing) {
          existing.qty += qty;
        } else {
          state.items.push({
            id: id,
            catalog: item.catalog,
            productId: item.productId || '',
            name: item.name || '',
            sku: item.sku || null,
            variant: item.variant || '',
            qty: qty,
            unitPrice: Number(item.unitPrice) || 0
          });
        }
        return state;
      }

      case 'ADJUST_QTY': {
        // Relative delta applied by the bridge itself (not the caller's cached
        // qty) so rapid clicks queue correctly instead of racing against
        // whatever qty value each caller last rendered. Floors at 1 — the qty
        // stepper can never delete a line, only the explicit "remover" button
        // (REMOVE_ITEM) can, so an extra click on "−" can't silently drop a
        // product from the list.
        var delta = Math.floor(Number((payload || {}).delta) || 0);
        for (var j = 0; j < state.items.length; j++) {
          if (state.items[j].id === payload.id) {
            state.items[j].qty = Math.max(1, state.items[j].qty + delta);
            break;
          }
        }
        return state;
      }

      case 'REMOVE_ITEM':
        state.items = state.items.filter(function (it) { return it.id !== (payload || {}).id; });
        return state;

      case 'CLEAR':
        return { storeName: state.storeName, items: [] };

      default:
        return state;
    }
  }

  var parentOrigin = null;

  window.addEventListener('message', function (e) {
    if (!isAllowedOrigin(e.origin)) return;
    var msg = e.data || {};

    if (msg.type === 'HELLO') {
      parentOrigin = e.origin;
      e.source.postMessage({ type: 'READY' }, e.origin);
      return;
    }

    if (e.origin !== parentOrigin) return;

    // Serialize read-modify-write across every tab/catalog that has this
    // bridge open — without this, two tabs adding items around the same
    // moment could each read the list before the other's write lands, and
    // whichever writes last would silently overwrite the other's item.
    // Web Locks are coordinated per-origin by the browser itself, so this
    // covers concurrent tabs even though each has its own bridge iframe.
    var apply = function () {
      var state = readState();
      var nextState = handle(msg.type, msg.payload, state);
      writeState(nextState);
      e.source.postMessage({ id: msg.id, ok: true, state: nextState }, e.origin);
    };

    if (navigator.locks && navigator.locks.request) {
      navigator.locks.request('chumbada-minha-selecao-lock', apply);
    } else {
      apply();
    }
  });

  // Cross-tab sync: when another tab's bridge iframe (same origin) writes a
  // change, this tab's storage event fires here, and we relay it to our own
  // parent so every open catalog tab stays in sync without polling.
  window.addEventListener('storage', function (e) {
    if (e.key !== STORAGE_KEY || !parentOrigin) return;
    parent.postMessage({ type: 'STATE_CHANGED', state: readState() }, parentOrigin);
  });
})();
</script>
</body>
</html>
